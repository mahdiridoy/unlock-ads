<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watch Ads to Unlock</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Monetag SDK — main zone -->
<script src='//libtl.com/sdk.js' data-zone='12223543' data-sdk='show_12223543'></script>
<style>
  body {
    font-family: -apple-system, Roboto, Arial, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #111111);
    text-align: center;
    padding: 24px 16px;
    margin: 0;
  }
  h2 { margin-bottom: 4px; }
  #progress { font-size: 18px; margin: 16px 0; }
  button {
    background: var(--tg-theme-button-color, #2ea6ff);
    color: var(--tg-theme-button-text-color, #ffffff);
    border: none;
    border-radius: 10px;
    padding: 14px 24px;
    font-size: 16px;
    width: 100%;
    max-width: 320px;
    margin-top: 16px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; }
  #status { margin-top: 16px; font-size: 14px; color: #888; min-height: 20px; }
</style>
</head>
<body>

<h2>🎬 Watch Ads to Unlock</h2>
<div id="progress">Ad 0 / 2 watched</div>
<button id="watchBtn">▶️ Watch Ad</button>
<div id="status"></div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  // Identify the user. Prefer Telegram's WebApp user id (secure context),
  // fall back to a "uid" query param if the bot passed one manually.
  const urlParams = new URLSearchParams(window.location.search);
  const telegramUser = tg?.initDataUnsafe?.user;
  const userId = telegramUser?.id || urlParams.get("uid");

  const ADS_REQUIRED = 2;
  const POSTBACK_BASE = "https://unlock-bot-xieo.onrender.com";
  // The count is read from the server (set only by Monetag's verified postback),
  // not stored in the browser, so it can't reset or be faked.
  let watched = 0;

  const progressEl = document.getElementById("progress");
  const statusEl = document.getElementById("status");
  const btn = document.getElementById("watchBtn");
  let running = false;

  function renderProgress() {
    progressEl.textContent = `Ad ${watched} / ${ADS_REQUIRED} watched`;
    if (watched >= ADS_REQUIRED) {
      btn.disabled = true;
      btn.textContent = "✅ All ads watched!";
      statusEl.textContent = "Go back to the bot and tap 'Check my progress'.";
      // No auto-close: the user closes this page themselves.
    } else {
      btn.disabled = running;
    }
  }

  async function fetchCount() {
    const r = await fetch(`${POSTBACK_BASE}/ad_status?user_id=${encodeURIComponent(userId)}`);
    const d = await r.json();
    return d.ads_watched;
  }

  async function refresh() {
    try { watched = await fetchCount(); } catch (e) { console.warn("status failed", e); }
    renderProgress();
  }

  async function notifyBackend() {
    // Log-only notice. The real count comes from Monetag's server postback.
    try {
      await fetch(`${POSTBACK_BASE}/client_ad_ping?user_id=${encodeURIComponent(userId)}`, { method: "POST" });
    } catch (e) { console.warn("Backend ping failed (non-fatal):", e); }
  }

  // ONE ad per tap. No auto-start, no automatic next ad, no auto-close.
  async function runAd() {
    if (running || watched >= ADS_REQUIRED) return;
    if (!userId) { statusEl.textContent = "Open this page from the bot's button."; return; }
    if (typeof show_12223543 !== "function") {
      statusEl.textContent = "Ad SDK not loaded yet — please wait a moment and try again.";
      return;
    }
    running = true;
    btn.disabled = true;
    statusEl.textContent = `Loading ad ${watched + 1} of ${ADS_REQUIRED}...`;
    const before = watched;
    try {
      await show_12223543({ ymid: String(userId) });
      notifyBackend();
      statusEl.textContent = "Checking your ad...";
      // Wait for Monetag's postback to reach the server (up to ~12s).
      for (let i = 0; i < 6; i++) {
        await new Promise((r) => setTimeout(r, 2000));
        try { watched = await fetchCount(); } catch (e) {}
        if (watched > before) break;
      }
      statusEl.textContent = watched > before
        ? `✅ Ad ${watched} of ${ADS_REQUIRED} counted!`
        : "Ad finished but not counted yet — wait a few seconds and tap again.";
    } catch (err) {
      console.warn(err);
      statusEl.textContent = "⚠️ Ad failed or was closed — tap to try again.";
    }
    running = false;
    renderProgress();
  }

  btn.addEventListener("click", runAd);
  refresh();
</script>
</body>
</html>
